[package]
name = "vault"
version = "0.5.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Volgenic's vault: keeps your agents' secrets on your own machine and lets agents use them without seeing them."
build = "build.rs"

[lib]
name = "vault"
path = "src/lib.rs"

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
age = "0.11"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
# A wallet's key (#7440): secp256k1 ECDSA with the recovery id, deterministic (RFC 6979), and
# Keccak-256 for Ethereum addresses and transaction hashes. Both RustCrypto, like sha2 and hmac.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# Solana and Tron wallets (#7490): a Solana key is Ed25519 (RFC 8032, deterministic), and an
# associated token account's address is checked to be off the curve (curve25519-dalek, which age
# already brings in). Both chains write addresses in base58 (Tron with a checksum).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
bs58 = "0.5"
libc = "0.2"
memchr = "2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
# The streaming proxy (`stream`): an async HTTPS client, so a call can time out when idle and stop
# when its caller hangs up. reqwest already runs on tokio; these are the parts the vault drives.
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
url = "2"
zeroize = "1"

# The proxy's HTTPS client verifies certificates against the operating system's trust store (R11):
# Security.framework on macOS, the system's root certificates (rustls with native roots) on Linux,
# so a Linux build needs no OpenSSL headers.
[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[features]
# For local evidence only, never in a release (scripts/release.sh doesn't enable it): with it, the
# daemon sends the kinds' upstream hosts and token servers (api.anthropic.com, chatgpt.com, auth.openai.com,
# cli-chat-proxy.grok.com, auth.x.ai) to 127.0.0.1 at VAULT_TEST_UPSTREAM_PORT
# and also trusts the CA in VAULT_TEST_CA, so a streamed reply can be shown from a local test
# server with the real TLS path. The daemon logs a warning at start when it is on.
test-upstream = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
